---
layout: default
body_classes: page-basic
---

<div class="oj-hero">
  <div class="oj-container">
    <div class="site-row site-justify-content-center">
      <div class="site-col-12 site-col-lg-10">
        {% include framework/blocks/sections/title.html
          title=page.title
          description=page.description
          image=page.image
          align="center"
        %}
      </div>
    </div>
  </div>
</div>

{% assign content = content | strip_newlines %}
{% if content != "" %}
  <div class="oj-section site-pt-0">
    <div class="oj-container">
      <div class="site-row site-justify-content-center">
        <div class="site-col-12 site-col-lg-8">
          <div class="content oj-prose">{{ content }}</div>
        </div>
      </div>
    </div>
  </div>
{% endif %}
