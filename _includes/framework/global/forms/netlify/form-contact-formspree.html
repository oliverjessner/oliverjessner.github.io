<form class="oj-stack" id="fs-frm" name="simple-contact-form" accept-charset="utf-8" action="{{ site.formspree.form_endpoint }}" method="post">
  <fieldset class="oj-stack site-form-fieldset" id="fs-frm-inputs">
    <div class="oj-field"><label class="oj-label" for="full-name">Full Name</label>
    <input class="oj-input" type="text" name="name" id="full-name" placeholder="First and Last" required=""></div>
    <div class="oj-field"><label class="oj-label" for="email-address">Email Address</label>
    <input class="oj-input" type="email" name="_replyto" id="email-address" placeholder="email@domain.tld" required=""></div>
    <div class="oj-field"><label class="oj-label" for="message">Message</label>
    <textarea class="oj-textarea" rows="5" name="message" id="message" placeholder="Aenean lacinia bibendum nulla sed consectetur. Vivamus sagittis lacus vel augue laoreet rutrum faucibus dolor auctor. Donec ullamcorper nulla non metus auctor fringilla nullam quis risus." required=""></textarea></div>
    <input type="hidden" name="_subject" id="email-subject" value="Contact Form Submission">
  </fieldset>
  <input class="oj-button oj-button-primary" type="submit" value="Submit">
</form>
