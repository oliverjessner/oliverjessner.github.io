<div class="contact">
  <form class="oj-stack" action="/contact/success" data-netlify="true" method="POST" name="contact">

  <div class="oj-field">
    <label class="oj-label" for="name">Name</label>
    <input class="oj-input" type="text" id="name" name="name" placeholder="Your name..">
  </div>

  <div class="oj-field">
    <label class="oj-label" for="email">Email</label>
    <input class="oj-input" type="text" id="email" name="email" placeholder="Your email..">
  </div>


  <div class="oj-field">
    <label class="oj-label" for="message">Message</label>
    <textarea class="oj-textarea" id="message" name="message" placeholder="Write something.." style="height:200px"></textarea>
  </div>

  <input class="oj-button oj-button-primary" type="submit" value="Submit">

  </form>
</div>
